<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><title>Versus Counter</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f7f9ff;background:#101827}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;justify-content:center;align-items:center}.wrap{width:min(100%,550px);padding:25px 0}h1{text-align:center;margin:0 0 7px;font-size:27px}.sub{text-align:center;color:#99a9c6;margin-bottom:25px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{padding:16px 10px 14px;border-radius:24px;text-align:center;background:#1c2940}.panel:nth-child(2){background:#30233e}.name{color:#fff;background:transparent;border:0;border-bottom:1px dashed #7c90aa;border-radius:0;text-align:center;width:100%;font:600 17px -apple-system,BlinkMacSystemFont,sans-serif;padding:7px 0;outline-offset:4px}.count{font-size:clamp(55px,15vw,88px);font-weight:800;font-variant-numeric:tabular-nums;margin:26px 0 20px;line-height:1}.plus{display:block;width:100%;border:0;border-radius:17px;padding:22px 0;color:#fff;font-size:37px;font-weight:800;background:#20886c;touch-action:manipulation}.panel:nth-child(2) .plus{background:#9a528e}.minus{margin-top:12px;border:1px solid #64738d;background:transparent;color:#fff;border-radius:12px;padding:10px 25px;font-size:23px;touch-action:manipulation}.reset{margin-top:25px;display:block;width:100%;padding:17px;border:1px solid #60708b;border-radius:16px;background:#202c41;color:white;font-size:17px;font-weight:650}.note{text-align:center;color:#95a6c3;font-size:13px;margin-top:20px;line-height:1.5}</style></head><body><main class="wrap"><h1>⚡ Versus Counter</h1><div class="sub">Tap + to count. Your scores stay until you reset.</div><section class="grid"><div class="panel"><input aria-label="First counter name" class="name" id="name0" maxlength="22" value="Thing 1"><div class="count" id="count0" aria-live="polite">0</div><button class="plus" data-index="0" data-change="1" aria-label="Add one to first count">+</button><button class="minus" data-index="0" data-change="-1" aria-label="Subtract one from first count">−</button></div><div class="panel"><input aria-label="Second counter name" class="name" id="name1" maxlength="22" value="Thing 2"><div class="count" id="count1" aria-live="polite">0</div><button class="plus" data-index="1" data-change="1" aria-label="Add one to second count">+</button><button class="minus" data-index="1" data-change="-1" aria-label="Subtract one from second count">−</button></div></section><button class="reset" id="reset">↺ Reset both counters</button><p class="note">Rename either side by tapping its heading.<br>Stored on this device and browser.</p></main><script>const key='versus-counter-v1';let state={counts:[0,0],names:['Thing 1','Thing 2']};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.counts)&&Array.isArray(saved.names))state={counts:saved.counts.map(x=>Math.max(0,Number(x)||0)).slice(0,2),names:saved.names.slice(0,2)}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function render(){for(let i=0;i<2;i++){document.getElementById('count'+i).textContent=state.counts[i]||0;document.getElementById('name'+i).value=state.names[i]||''}}render();document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.index;state.counts[i]=Math.max(0,(state.counts[i]||0)+Number(b.dataset.change));save();render()}));for(let i=0;i<2;i++)document.getElementById('name'+i).addEventListener('input',e=>{state.names[i]=e.target.value;save()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset both counters to zero?')){state.counts=[0,0];save();render()}});</script></body></html>
